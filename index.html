<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runden-Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- LEHRER ANSICHT -->
    <div id="teacher-view" class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 text-center">
        <h1 class="text-2xl font-bold mb-2 text-gray-800">Lehrer-Dashboard</h1>
        <p class="text-xs text-gray-500 mb-4">(Klicke auf einen Schüler für die Rundenzeiten)</p>
        
        <div id="qr-container" class="flex justify-center mb-4"><img id="qr-image" src="" alt="QR" class="w-48 h-48"></div>
        
        <!-- Start-Button für den Lehrer -->
        <button id="start-tracking-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg mb-4 shadow transition">
            🚀 Rennen Starten!
        </button>
        <p id="race-status" class="text-sm font-semibold text-gray-600 mb-4">Status: Wartet auf Start...</p>

        <h2 class="text-lg font-semibold text-left mb-2">Live-Runden:</h2>
        <div id="live-list" class="space-y-2 text-left"></div>
    </div>

    <!-- MODAL FÜR RUNDENZEITEN -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-xl relative">
            <h2 id="modal-title" class="text-xl font-bold mb-4 text-gray-800">Rundenzeiten</h2>
            <div id="modal-times-list" class="space-y-2 max-h-60 overflow-y-auto mb-4 border p-2 rounded bg-gray-50 text-left text-sm"></div>
            <button onclick="closeModal()" class="w-full bg-gray-600 text-white font-bold py-3 rounded-lg">Schließen</button>
        </div>
    </div>

    <!-- SCHÜLER LOGIN -->
    <div id="login-view" class="hidden w-full max-w-md bg-white rounded-xl shadow-lg p-6 text-center">
        <h1 class="text-xl font-bold mb-6">Wie heißt du?</h1>
        <input type="text" id="name-input" placeholder="Dein Name" class="w-full border p-3 rounded-lg mb-4">
        <button id="join-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg">Anmelden</button>
    </div>

    <!-- SCHÜLER AKTIV -->
    <div id="student-view" class="hidden w-full max-w-md bg-white rounded-xl shadow-xl p-6 text-center">
        <h1 id="welcome-msg" class="text-2xl font-bold mb-2"></h1>
        <p class="text-sm text-emerald-600 font-semibold mb-2">Du bist angemeldet!</p>
        <button id="pocket-btn" class="w-full bg-emerald-600 text-white font-bold py-5 rounded-xl mt-4">📴 Pocket-Modus starten</button>
    </div>

    <!-- POCKET OVERLAY -->
    <div id="pocket-overlay" class="hidden fixed inset-0 bg-black z-50 flex flex-col items-center justify-center text-white">
        <p class="text-xl font-bold animate-pulse">LÄUFT... (Handy in Tasche)</p>
        <p class="text-xs text-gray-500 mt-4">(Zum Beenden 3 Sek. gedrückt halten)</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://afusoaugsqjjivxjhgrj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdXNvYXVnc3Fqaml2eGpoZ3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTg3NDIsImV4cCI6MjEwMjM5NDc0Mn0.EHgeUwGY-1XtmuexegWNoUn97u-RArInWzD7NVIQJHo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');

        window.lastTriggerTime = {};
        window.studentState = {};
        window.raceStarted = false; // Lokaler Schalter für den Start

        if (name) {
            document.getElementById('teacher-view').classList.add('hidden');
            document.getElementById('student-view').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `Hallo, ${name}!`;

            let studentId;
            async function initStudent() {
                let { data } = await supabaseClient.from('runden_tracker').select('*').eq('schueler_name', name);
                if (data && data.length > 0) {
                    studentId = data[0].id;
                } else {
                    let res = await supabaseClient.from('runden_tracker').insert([{ schueler_name: name, runden: 0, last_seen: new Date().toISOString()}]).select();
                    studentId = res.data[0].id;
                }

                // Regelmäßiges Lebenszeichen senden
                setInterval(async () => {
                    await supabaseClient.from('runden_tracker').update({ last_seen: new Date().toISOString() }).eq('id', studentId);
                }, 2000);
            }
            initStudent();

            const pocketBtn = document.getElementById('pocket-btn');
            const overlay = document.getElementById('pocket-overlay');
            pocketBtn.onclick = () => overlay.classList.remove('hidden');
            
            let holdTimer;
            overlay.addEventListener('touchstart', () => holdTimer = setTimeout(() => overlay.classList.add('hidden'), 3000));
            overlay.addEventListener('touchend', () => clearTimeout(holdTimer));
        } 
        else if (window.location.search.includes('login=true')) {
            document.getElementById('teacher-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('join-btn').onclick = () => {
                const n = document.getElementById('name-input').value;
                if(n) window.location.href = `?name=${encodeURIComponent(n)}`;
            };
        } else {
            const loginUrl = window.location.href.split('?')[0] + '?login=true';
            document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(loginUrl)}`;
            
            // Lehrer Start-Button Logik
            const startBtn = document.getElementById('start-tracking-btn');
            const statusText = document.getElementById('race-status');

            startBtn.onclick = () => {
                window.raceStarted = true;
                startBtn.innerText = "🛑 Rennen läuft!";
                startBtn.className = "w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-lg mb-4 shadow transition";
                statusText.innerText = "Status: Rennen ist AKTIV (Runden werden gezählt)";
                statusText.className = "text-sm font-semibold text-emerald-600 mb-4";
            };

            async function refresh() {
                let { data } = await supabaseClient.from('runden_tracker').select('*').order('runden', { ascending: false });
                if (!data) return;
                
                document.getElementById('live-list').innerHTML = data.map(s => `
                    <div onclick="openStudentDetails('${s.id}', '${s.schueler_name}')" class="flex justify-between bg-gray-50 p-3 rounded border cursor-pointer hover:bg-blue-50 transition">
                        <span>${s.schueler_name}</span> <b>${s.runden} Runden</b>
                    </div>`).join('');
                
                // Wenn der Lehrer noch nicht auf Start gedrückt hat, keine Runden zählen!
                if (!window.raceStarted) return;

                const now = Date.now();
                data.forEach(async (s) => {
                    if (!s.last_seen) return;
                    let lastSeenTime = new Date(s.last_seen).getTime();
                    let diffSeconds = (now - lastSeenTime) / 1000;
                    
                    let isPresent = diffSeconds < 3;

                    if (!window.studentState[s.id]) {
                        window.studentState[s.id] = 'away';
                    }

                    if (isPresent && window.studentState[s.id] === 'away') {
                        if (!window.lastTriggerTime[s.id] || (now - window.lastTriggerTime[s.id] > 10000)) {
                            window.lastTriggerTime[s.id] = now;
                            window.studentState[s.id] = 'present';
                            
                            let newRounds = s.runden + 1;
                            
                            await supabaseClient.from('runden_tracker').update({ runden: newRounds }).eq('id', s.id);
                            await supabaseClient.from('runden_zeiten').insert([{ student_id: s.id, runden_nummer: newRounds }]);
                        }
                    } 
                    else if (!isPresent && diffSeconds > 5) {
                        window.studentState[s.id] = 'away';
                    }
                });
            }
            setInterval(refresh, 1500);
            supabaseClient.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'runden_tracker' }, refresh).subscribe();
        }

        async function openStudentDetails(studentId, studentName) {
            document.getElementById('modal-title').innerText = `Rundenzeiten für ${studentName}`;
            document.getElementById('modal-times-list').innerHTML = 'Lade Zeiten...';
            document.getElementById('detail-modal').classList.remove('hidden');

            let { data } = await supabaseClient
                .from('runden_zeiten')
                .select('*')
                .eq('student_id', studentId)
                .order('runden_nummer', { ascending: true });

            if (!data || data.length === 0) {
                document.getElementById('modal-times-list').innerHTML = '<p class="text-gray-500">Noch keine Runden aufgezeichnet.</p>';
                return;
            }

            let html = '';
            let previousTime = null;

            data.forEach((r, index) => {
                let currentTime = new Date(r.created_at).getTime();
                let durationText = "Start";

                if (index > 0 && previousTime) {
                    let diffMs = currentTime - previousTime;
                    let totalSeconds = Math.floor(diffMs / 1000);
                    let minutes = Math.floor(totalSeconds / 60);
                    let seconds = totalSeconds % 60;
                    durationText = `${minutes} Min. ${seconds < 10 ? '0' : ''}${seconds} Sek.`;
                }

                previousTime = currentTime;
                html += `<div class="flex justify-between border-b py-1"><span>Runde ${r.runden_nummer}</span> <b>${durationText}</b></div>`;
            });

            document.getElementById('modal-times-list').innerHTML = html;
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
