<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runden-Tracker Test</title>
    <!-- Tailwind CSS für schnelles Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- ANSICHT 1: LEHRER (Standard ohne URL-Parameter) -->
    <div id="teacher-view" class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 text-center">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Lehrer-Dashboard</h1>
        <div id="qr-container" class="flex justify-center mb-4">
            <canvas id="qrcode"></canvas>
        </div>
        <p class="text-sm text-gray-500 mb-6">Lernende scannen diesen QR-Code mit dem Handy.</p>
        
        <h2 class="text-lg font-semibold text-left mb-2">Live-Runden:</h2>
        <div id="live-list" class="space-y-2 text-left">
            <p class="text-gray-400 italic">Warte auf Teilnehmer...</p>
        </div>
    </div>

    <!-- ANSICHT 2: SCHÜLER (Wird geöffnet, wenn ?role=student&name=... in der URL steht) -->
    <div id="student-view" class="hidden w-full max-w-md bg-white rounded-xl shadow-lg p-6 text-center">
        <h1 id="welcome-msg" class="text-xl font-bold mb-6 text-gray-800"></h1>
        <button id="lap-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-12 rounded-2xl text-3xl shadow-xl transition transform">
            + RUNDE ZÄHLEN
        </button>
        <p id="status-msg" class="text-sm text-green-600 mt-4 font-medium"></p>
    </div>

    <script>
        // DEINE EINGETRAGENEN SUPABASE DATEN:
        const SUPABASE_URL = 'https://afusoaugsqjjivxjhgrj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmdXNvYXVnc3Fqaml2eGpoZ3JqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MTg3NDIsImV4cCI6MjEwMjM5NDc0Mn0.EHgeUwGY-1XtmuexegWNoUn97u-RArInWzD7NVIQJHo';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // URL auswerten
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role');
        const studentName = urlParams.get('name');

        const teacherView = document.getElementById('teacher-view');
        const studentView = document.getElementById('student-view');

        if (role === 'student' && studentName) {
            // --- SCHÜLER MODUS ---
            teacherView.classList.add('hidden');
            studentView.classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = `Hallo, ${studentName}!`;

            let studentId = null;

            async function registerOrGetStudent() {
                let { data, error } = await supabaseClient
                    .from('runden_tracker')
                    .select('*')
                    .eq('schueler_name', studentName)
                    .single();

                if (!data) {
                    let insertRes = await supabaseClient
                        .from('runden_tracker')
                        .insert([{ schueler_name: studentName, runden: 0 }])
                        .select()
                        .single();
                    studentId = insertRes.data.id;
                } else {
                    studentId = data.id;
                }
            }
            registerOrGetStudent();

            document.getElementById('lap-btn').addEventListener('click', async () => {
                if (!studentId) return;
                
                let { data } = await supabaseClient.from('runden_tracker').select('runden').eq('id', studentId).single();
                let newLaps = (data?.runden || 0) + 1;

                let { error } = await supabaseClient
                    .from('runden_tracker')
                    .update({ runden: newLaps })
                    .eq('id', studentId);

                if (!error) {
                    document.getElementById('status-msg').innerText = `Runde ${newLaps} erfolgreich übermittelt!`;
                    setTimeout(() => document.getElementById('status-msg').innerText = '', 2000);
                }
            });

        } else {
            // --- LEHRER MODUS ---
            studentView.classList.add('hidden');
            teacherView.classList.remove('hidden');

            const currentBaseUrl = window.location.href.split('?')[0];
            
            QRCode.toCanvas(document.getElementById('qrcode'), currentBaseUrl, { width: 200 }, function (error) {
                if (error) console.error(error);
            });

            async function fetchLeaderboard() {
                let { data, error } = await supabaseClient
                    .from('runden_tracker')
                    .select('*')
                    .order('runden', { ascending: false });

                const listEl = document.getElementById('live-list');
                if (data && data.length > 0) {
                    listEl.innerHTML = data.map(s => `
                        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                            <span class="font-medium text-gray-700">${s.schueler_name}</span>
                            <span class="bg-indigo-100 text-indigo-800 font-bold px-3 py-1 rounded-full">${s.runden} Runden</span>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = `<p class="text-gray-400 italic">Noch keine Schüler angemeldet.</p>`;
                }
            }

            fetchLeaderboard();

            // Realtime Listener
            supabaseClient
                .channel('public:runden_tracker')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'runden_tracker' }, payload => {
                    fetchLeaderboard();
                })
                .subscribe();
        }
    </script>
</body>
</html>
